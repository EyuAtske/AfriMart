global:
  scrape_interval: 15s
  # Explicitly enable exemplar storage
  scrape_protocols:
    - OpenMetricsText1.0.0
    - OpenMetricsText0.0.1
    - PrometheusText0.0.4

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    # Force Prometheus to accept OpenMetrics format (which contains exemplars)
    honor_labels: true