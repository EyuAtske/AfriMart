services:
  backend:
    container_name: afrimart-backend 
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: "postgres://postgres:postgres@postgres:5432/afrimart?sslmode=disable"
      SECRET_KEY: "afrimart-secret"
      RABBITMQ_URL: "amqp://admin:admin@rabbitmq:5672/"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: "minio"
      MINIO_SECRET_KEY: "minio123"
      MINIO_BUCKET: "afrimart-images"
      MINIO_USE_SSL: "false"
    depends_on:
      - postgres
      - rabbitmq
      - otel-collector
      - minio
      - migrate
  frontend:
    container_name: afrimart-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_PROXY_TARGET=http://backend:8080
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: "http://backend:8080"
      NUXT_PUBLIC_AUTH_MODE: "api"
    depends_on:
      - backend
  postgres:
    image: postgres:17
    container_name: afrimart-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afrimart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:4-management
    container_name: afrimart-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: afrimart-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889" 
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:3.0.0
    container_name: afrimart-tempo
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
  loki:
    image: grafana/loki:3.7.0
    container_name: afrimart-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
  alloy:
    image: grafana/alloy:latest
    container_name: afrimart-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    ports:
      - "12345:12345"
    depends_on:
      - loki
  prometheus:
    image: prom/prometheus:latest
    container_name: afrimart-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    depends_on:
      - otel-collector
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: afrimart-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SERVER_HTTP_ADDR=0.0.0.0 
    depends_on:
      - tempo
      - loki
    volumes:
      - afrimart-grafana-test:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: afrimart-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
  migrate:
    image: golang:1.22-alpine
    container_name: afrimart-migrate
    command: >
      sh -c "
        go install github.com/pressly/goose/v3/cmd/goose@v3.20.0 &&
        goose -dir /sql/schema postgres 'postgres://postgres:postgres@postgres:5432/afrimart?sslmode=disable' up
      "
    volumes:
      - ./sql:/sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  rabbitmq_data:
  tempo_data:
  afrimart-grafana-test:
  loki_data:
  alloy_data:
  prometheus_data:
  minio_data: