name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "sql/**"
      - "sqlc.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - "sql/**"
      - "sqlc.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run tests
        working-directory: backend
        run: go test ./...

  backend-build:
    name: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Build backend
        working-directory: backend
        run: go build ./...